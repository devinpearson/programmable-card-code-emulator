version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Group routine dev-tooling bumps into one PR a week instead of one PR per
    # package. Runtime dependencies (isolated-vm, moment-mini) still get their
    # own PRs so each one can be reviewed and released on its own.
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
